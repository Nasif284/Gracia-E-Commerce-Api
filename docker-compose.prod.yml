services:
  shopping-cart-api:
    image: ${DOCKER_IMAGE:-nasif284/gracia-shopping-cart:latest}
    container_name: shopping-cart-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - app-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  app-network:
    external: true
