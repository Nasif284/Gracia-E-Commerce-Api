name: Deploy Shopping Cart App

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: nasif284/gracia-shopping-cart:latest

  deploy:
    name: Deploy to AWS EC2 via SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "==== Step 2: Authenticating with Docker Hub ===="
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "==== Step 3: Pulling latest Docker image ===="
            docker pull nasif284/gracia-shopping-cart:latest

            echo "==== Step 4: Stopping and removing previous container ===="
            docker stop shopping-cart-app-container || true
            docker rm -f shopping-cart-app-container || true

            echo "==== Step 5: Starting new production container ===="
            docker run -d \
              --name shopping-cart-app-container \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/ubuntu/.env \
              nasif284/gracia-shopping-cart:latest

            echo "==== Step 6: Cleaning up unused Docker artifacts ===="
            docker system prune -f

            echo "==== Deployment successfully finished! ===="