name: Deploy Shopping Cart App

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nasif284/gracia-shopping-cart:latest
            nasif284/gracia-shopping-cart:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2 via SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code for Compose Spec
        uses: actions/checkout@v4

      - name: Ensure Application Directory and Network Exist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/apps/shopping-cart
            docker network inspect app-network >/dev/null 2>&1 || docker network create app-network

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.EC2_USER }}/apps/shopping-cart"

      - name: Execute Zero-Downtime Rollout on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/apps/shopping-cart

            echo "==== Step 1: Authenticating with Docker Hub ===="
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "==== Step 2: Pulling latest Docker image ===="
            docker compose -f docker-compose.prod.yml pull shopping-cart-api

            echo "==== Step 3: Rolling out updated container stack ===="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==== Step 4: Cleaning up unused Docker images ===="
            docker image prune -f

            echo "==== Deployment successfully finished! ===="